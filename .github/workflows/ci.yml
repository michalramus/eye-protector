name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      # Only the tagged-release step needs write; harmless on other runs.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./build.sh release

      - name: Package DMG
        run: ./Scripts/make-dmg.sh "${GITHUB_REF_NAME//\//-}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EyeProtector-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
